[server]
address = "0.0.0.0"
headless = true
enableCORS = false
enableXsrfProtection = false

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#2563a6"
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#161b22"
textColor = "#e6edf3"
font = "sans serif"
baseFontSize = 14
baseRadius = "6px"
buttonRadius = "6px"
borderColor = "#303943"
showWidgetBorder = true
headingFontSizes = ["26px", "22px", "18px", "16px", "14px", "12px"]
